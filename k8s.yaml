apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs554-midterm
  labels:
    app: cs554-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs554-midterm
  template:
    metadata:
      labels:
        app: cs554-midterm
    spec:
      containers:
        - name: web
          image: cs554-midterm:1.0.0
          # Imported with "k3d image import"; never pull from a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: k3d-deployment
            - name: MESSAGE
              value: Hello from Kubernetes (k3d)
            # Readiness experiment: "touch /tmp/not-ready" inside ONE Pod makes
            # /health return 503 for that Pod only; "rm" restores it.
            - name: NOT_READY_FILE
              value: /tmp/not-ready
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cs554-midterm
spec:
  type: ClusterIP
  selector:
    app: cs554-midterm
  ports:
    - name: http
      port: 80
      targetPort: http
